 let base={records,workflows:[],notifications:[],grants:[],activities:[],settings:{name:'BagRenmin Densus 88 AT Polri',subtitle:'Digital Workspace',logo:''}};

 };

 mk('DSP-004','Undangan koordinasi internal','urmin',6,100,[[0,'urmin','Agenda terdaftar',9000],[1,'kabag','Arahan untuk ditindaklanjuti Urmin',8000],[2,'urmin','Tugas diterima',7200],[3,'urmin','Kegiatan sudah ditindaklanjuti',6400],[4,'urmin','Tindak lanjut terverifikasi',4000],[5,'kabag','Selesai dan dinyatakan tuntas',1200]]);
 for(let w of base.workflows){if(w.stage<6){base.notifications.push({id:'NT-'+w.id,to:w.assigned,workflowId:w.id,title:'Disposisi memerlukan tindakan',body:w.subject,at:dt(),read:false})}}
 return base;

function load(){try{let t=JSON.parse(localStorage.getItem(STORAGE)||'null');if(t&&Array.isArray(t.records)&&Array.isArray(t.workflows)&&Array.isArray(t.notifications)&&t.settings){db=t;return}}catch{}db=seed();save()}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch{toast('Penyimpanan demo di browser gagal',true)}}
const actor=id=>byId(id)?.name||'Pengguna demo';
const isLeader=()=>user?.id==='kabag';
const canSummary=u=>!!user&&(isLeader()||user.unit===u||user.id==='auditor'||(db.grants||[]).some(g=>g.to===user.id&&g.unit===u));
const canUnit=u=>!!user&&(isLeader()||user.unit===u||(db.grants||[]).some(g=>g.to===user.id&&g.unit===u&&g.level==='operate'));
const canReadRecord=r=>!!user&&canUnit(r.unit)&&(!String(r.classification||'').toLowerCase().includes('rahasia')||user.unit===r.unit);
const canCreate=u=>!!user&&user.id!=='admin'&&user.id!=='auditor'&&canUnit(u);
const canEdit=r=>canReadRecord(r)&&canCreate(r.unit)&&r.approval<3;
const canApprove=r=>canReadRecord(r)&&((r.approval===1&&(isLeader()||(user.role==='Kasubbag'&&user.unit===r.unit)||user.id==='urmin'&&r.unit==='urmin'))||(r.approval===2&&isLeader()));
const canWorkflow=w=>!!user&& (isLeader()||user.id==='urmin'||user.id===w.assigned||user.unit===w.unit||user.id==='auditor');
const canFlowDetail=w=>canWorkflow(w)&&user.id!=='auditor'&&(!(w.priority||'').includes('Rahasia')||user.unit===w.unit||user.id===w.assigned);
const canActWorkflow=w=>!!user&&w.stage<6&&w.assigned===user.id;
const st=t=>`<span class="tag ${['Selesai','Disetujui'].includes(t)?'teal':['Menunggu Persetujuan','Menunggu Evaluasi'].includes(t)?'orange':t==='Ditolak'?'red':'blue'}">${e(t)}</span>`;
function toast(msg,bad=false){let box=document.getElementById('toasts');if(!box)return;let t=document.createElement('div');t.className='toast '+(bad?'err':'');t.textContent=msg;box.appendChild(t);setTimeout(()=>t.remove(),3600)}
const unread=()=>db.notifications.filter(n=>n.to===user?.id&&!n.read).length;
const notices=()=>db.notifications.filter(n=>n.to===user?.id).sort((a,b)=>b.at.localeCompare(a.at));
const myFlows=()=>db.workflows.filter(w=>canWorkflow(w));
const myTasks=()=>db.workflows.filter(w=>w.assigned===user?.id&&w.stage<6);
const visibleRecords=u=>db.records.filter(r=>r.unit===u&&canReadRecord(r));
const labelUnit=u=>U[u]?.name||u;
function notify(to,resourceId,title,body,kind='flow'){db.notifications.unshift({id:'NT'+Date.now()+Math.random().toString(36).slice(2,5),to,...(kind==='record'?{recordId:resourceId}:{workflowId:resourceId}),title,body,read:false,at:dt()})}
function log(by,type,detail){db.activities.unshift({by,at:dt(),type,detail});db.activities=db.activities.slice(0,150)}
function go(view,unit=null,id=null,menu=null){ui={...ui,view,unit,id,menu,notify:false,side:false,query:''};const route=view==='unit'?`/unit/${unit}/${menu||'overview'}`:view==='flow'?`/flow/${id}`:`/${view}`;if(location.hash!=='#'+route)location.hash='#'+route;render();window.scrollTo(0,0)}
function route(){let p=location.hash.replace(/^#\/?/,'').split('/');let v=p[0]||'portal';if(v==='unit')ui={...ui,view:'unit',unit:modules.includes(p[1])?p[1]:null,menu:p[2]||'overview'};else if(v==='flow')ui={...ui,view:'flow',id:p[1]};else if(['portal','inbox','notifications','rbac','settings','flows'].includes(v))ui={...ui,view:v,unit:null};else ui={...ui,view:'portal',unit:null};render()}
function login(){return `<div class="auth-shell"><aside class="auth-hero"><div class="auth-hero-inner"><div class="auth-logo"><span class="logo-mark">${ic('shield','lg')}</span><span><strong>BAGRENMIN</strong><small>DIGITAL WORKSPACE</small></span></div><div class="auth-eyebrow">INTEGRATED MANAGEMENT PORTAL</div><h1>Satu pintu untuk seluruh pekerjaan BagRenmin.</h1><p>Perencanaan, administrasi, personel, pembinaan fungsi, disposisi dan monitoring pekerjaan yang terhubung dalam satu workspace.</p><div class="auth-hero-bottom"><span class="green-dot"></span> Prototype interaktif · seluruh identitas dan data bersifat fiktif</div></div></aside><main class="auth-main"><div class="auth-card"><div class="mobile-logo">${ic('shield')} BAGRENMIN WORKSPACE</div><div class="section-eyebrow">SIMULASI AUTHENTICATION</div><h2>${authStep==='otp'?'Verifikasi email OTP':'Selamat datang kembali'}</h2><p>${authStep==='otp'?'Masukkan kode 6 digit dari panel demo di bawah. Belum terhubung ke layanan email.':'Pilih identitas peran untuk menguji akses sesuai kewenangan masing-masing unit.'}</p>${authStep==='otp'?`<div class="demo-email">${ic('inbox')} Simulasi OTP untuk <b>${actor(authChoice)}</b><br><span>Panel demo: kode <strong id="demo-code">${otp}</strong> (tidak terkirim ke email)</span></div><form id="otp-form"><label class="form-label">Kode verifikasi</label><input class="auth-field otp-input" id="otp-input" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" autocomplete="one-time-code" required><button class="btn primary wide" type="submit">${ic('check')} Verifikasi & Masuk</button></form><button class="mini-back" data-action="back-login">← Ganti akun demo</button>`:`<form id="login-form"><label class="form-label">Pengguna demo</label><select id="login-user" class="auth-field">${users.map(u=>`<option value="${u.id}" ${u.id===authChoice?'selected':''}>${e(u.name)} — ${e(u.caption)}</option>`).join('')}</select><div class="demo-email" style="margin:18px 0">${ic('info')} Login demo tanpa password riil. Verifikasi OTP akan disimulasikan.</div><button class="btn primary wide" type="submit">Lanjut ke Verifikasi OTP ${ic('arrow')}</button></form>`}<div class="auth-disclaimer">${ic('lock','sm')} Demo lokal tidak menyediakan autentikasi, RBAC atau OTP yang aman secara server-side. Jangan gunakan data rahasia/riil.</div></div></main></div>`}
function header(){let logo=validLogo(db.settings.logo)?`<img src="${db.settings.logo}" alt="Logo instansi">`:ic('shield','lg');return `<header class="header"><div class="header-left"><button class="btn icon ghost hamburger" data-action="toggle-side" aria-label="Buka navigasi">${ic('menu')}</button><button class="header-brand" data-action="go-portal"><span class="logo-mark">${logo}</span><span class="brand-text"><strong>BAGRENMIN <em>WORKSPACE</em></strong><small>DENSUS 88 AT POLRI · PROTOTYPE</small></span></button></div><div class="header-right"><span class="demo-label">${ic('shield','sm')} DEMO / OFFLINE</span><button class="header-link nav-text" data-action="go-portal">${ic('home','sm')} Portal Utama</button><button class="header-link nav-text" data-action="my-inbox">${ic('clipboard','sm')} Tugas Saya</button>${user.id==='admin'||user.id==='kabag'?`<button class="header-link nav-text" data-action="rbac">${ic('shield','sm')} RBAC</button>`:''}${user.id==='admin'?`<button class="header-link nav-text" data-action="settings">${ic('settings','sm')} Konfigurasi</button>`:''}<button class="header-bell ${unread()?'ring':''}" data-action="toggle-notify" aria-label="Notifikasi">${ic('bell')}${unread()?`<sup>${unread()}</sup>`:''}</button><button class="profile" data-action="profile"><span class="avatar">${user.initial}</span><span class="profile-text"><strong>${e(user.name)}</strong><small>${user.unit?U[user.unit].name:user.role}</small></span>${ic('chevron','sm')}</button></div></header>${ui.notify?notificationDrop():''}`}
function notificationDrop(){let n=notices().slice(0,5);return `<div class="notify-drop"><div class="space"><strong>Pusat notifikasi</strong><span class="tag blue">${unread()} baru</span></div><div class="notify-items">${n.length?n.map(x=>`<button class="notify-entry ${x.read?'':'unread'}" data-action="open-notify" data-id="${e(x.id)}"><div class="notify-dot"></div><span><b>${e(x.title)}</b><small>${e(x.body)}</small><time>${fmt(x.at,true)}</time></span></button>`).join(''):'<div class="empty">Belum ada notifikasi.</div>'}</div><button class="btn wide" data-action="notifications-page">Lihat semua notifikasi ${ic('arrow','sm')}</button></div>`}
function portal(){let n=myTasks().length;let accessible=modules.filter(canUnit);let cards=modules.map(k=>{let u=U[k],ok=canUnit(k),summary=canSummary(k),num=summary?visibleRecords(k).length:'—';return `<button class="unit-card ${ok?'':'unit-locked'}" style="--unit:${u.color};--soft:${u.soft}" data-action="unit" data-unit="${k}" ${ok?'':'disabled title="Unit di luar kewenangan akun ini"'}><span class="unit-icon">${ic(u.icon,'lg')}</span><h3>${u.name}</h3><p>${u.description}</p><span class="unit-bottom">${ok?`<span>${u.menus.length} modul · ${num} data</span>${ic('arrow')}`:`<span>${ic('lock','sm')} Akses dibatasi</span>`}</span></button>`}).join('');return `<main class="page-wrap"><div class="portal-top"><div class="portal-copy"><div class="eyeline">PUSAT KENDALI ADMINISTRASI</div><h1>Selamat datang,<br>${e(user.name)}.</h1><p>Ruang kerja terintegrasi dengan akses sesuai kewenangan, disposisi berjenjang, dan pemantauan progres antarunit.</p><div class="welcome-links"><button class="btn gold" data-action="my-inbox">${ic('clipboard','sm')} Tugas Saya ${n?`<b>(${n})</b>`:''}</button><button class="btn hero-secondary" data-action="flows">${ic('activity','sm')} Monitor Disposisi</button>${user.id==='admin'?`<button class="btn hero-secondary" data-action="rbac">${ic('shield','sm')} Kelola RBAC</button><button class="btn hero-secondary" data-action="settings">${ic('settings','sm')} Pengaturan</button>`:''}</div></div><div class="portal-brand"><span class="logo-mark">${ic('shield','lg')}</span></div></div><div class="welcome-caption"><span class="green-dot"></span> Login sebagai <strong>${e(user.role)}</strong>${user.unit?' · '+U[user.unit].name:''}<span class="caption-sep">•</span> Akses data mengikuti kebijakan kewenangan.</div><div class="space"><div><div class="portal-overline">DIREKTORI UNIT</div><h2 class="section-title" style="margin:0 0 20px">Pilih Ruang Kerja</h2></div><span class="tag blue">${accessible.length} dari 4 unit dapat diakses</span></div><div class="grid cols4">${cards}</div><div class="grid cols4 portal-kpi">${kpi('Disposisi di Akses Saya',myFlows().length,'clipboard')}${kpi('Menunggu Tindakan Saya',n,'clock')}${kpi('Notifikasi Baru',unread(),'bell')}${kpi('Unit Terotorisasi',accessible.length,'shield')}</div><div class="grid cols2 portal-extras"><section class="panel panel-pad"><div class="panel-h"><h3>Disposisi yang Sedang Berjalan</h3><button class="mini-link" data-action="flows">Lihat Semua →</button></div>${myFlows().filter(w=>w.stage<6).slice(0,4).map(w=>`<button class="portal-flow" data-action="open-flow" data-id="${e(w.id)}"><span class="mini-icon">${ic('activity')}</span><span class="grow"><strong>${e(w.subject)}</strong><small>${e(w.id)} · ${e(labels[w.stage])} · ${e(labelUnit(w.unit))}</small></span><span class="status-pulse"></span></button>`).join('')||'<div class="empty">Belum ada disposisi dalam lingkup akses.</div>'}</section><section class="panel panel-pad"><div class="panel-h"><h3>Agenda Tindakan Saya</h3><button class="mini-link" data-action="my-inbox">Buka Inbox →</button></div>${myTasks().map(w=>`<button class="portal-flow" data-action="open-flow" data-id="${e(w.id)}"><span class="mini-icon warm">${ic('clock')}</span><span class="grow"><strong>${e(w.subject)}</strong><small>${e(w.id)} · Target ${fmt(w.due)}</small></span>${ic('chevron','sm')}</button>`).join('')||'<div class="empty">Tidak ada tugas disposisi tertunda.</div>'}</section></div><p class="footnote page-footer">Alur, kewenangan dan unit kerja adalah konfigurasi contoh untuk demo. Implementasi final mengikuti SOP, klasifikasi naskah dinas, dan pendelegasian kewenangan yang disahkan instansi.</p></main>`}
function kpi(t,n,icon){return `<div class="kpi"><span class="kpi-ic">${ic(icon)}</span><span><small>${t}</small><b>${n}</b></span></div>`}
function sidebar(){let u=U[ui.unit];return `<aside class="side ${ui.side?'mobile-open':''}"><div class="side-top"><span class="tag" style="background:${u.soft};color:${u.color}">${ic(u.icon,'sm')} ${u.name}</span><div class="side-name">${u.full}</div><div class="side-small">${u.subtitle}</div></div><div class="side-scroll"><div class="side-group">RINGKASAN</div><button class="side-btn ${ui.menu==='overview'?'active':''}" data-action="unit-page" data-menu="overview">${ic('home')} Dashboard Unit</button><div class="side-group">LAYANAN OPERASIONAL</div>${u.menus.map(m=>`<button class="side-btn ${ui.menu===m?'active':''}" data-action="unit-page" data-menu="${m}">${ic(MENUS[m].icon)} ${MENUS[m].title}</button>`).join('')}<div class="side-group">MONITORING</div><button class="side-btn" data-action="my-inbox">${ic('clipboard')} Tugas Saya</button><button class="side-btn" data-action="flows">${ic('activity')} Alur Disposisi</button></div><div class="side-bottom"><button class="btn side-back" data-action="go-portal">${ic('left','sm')} Kembali ke Portal</button></div></aside>`}
function unitWorkspace(){const u=U[ui.unit];if(!u||!canUnit(ui.unit))return denied();const men=ui.menu||'overview';let content=men==='overview'?overview(ui.unit):MENUS[men]?.unit===ui.unit?recordsPage(men):denied();return `<div class="workspace">${sidebar()}<div class="overlay ${ui.side?'visible':''}" data-action="close-side"></div><main class="work-main"><div class="work-content"><div class="crumb"><button class="mini-link" data-action="go-portal">Portal</button>${ic('chevron','sm')}<b>${e(u.name)}</b>${men==='overview'?'':ic('chevron','sm')+(MENUS[men]?.title||'')}</div>${content}</div></main></div>`}
function sectionHeading(title,desc,buttons=''){return `<div class="heading"><div><div class="section-eyebrow">${e(ui.unit?U[ui.unit].name:'BAGRENMIN')} · OPERASIONAL</div><h1>${e(title)}</h1><p>${e(desc)}</p></div><div class="heading-actions">${buttons}</div></div>`}
function overview(unit){let u=U[unit],rs=visibleRecords(unit);return `${sectionHeading(u.full,u.subtitle,canCreate(unit)?`<button class="btn primary" data-action="new-record" data-menu="${u.menus[0]}">${ic('plus','sm')} Tambah Data</button>`:'')}<div class="grid cols4">${kpi('Total Data Unit',rs.length,'folder')}${kpi('Pekerjaan Aktif',rs.filter(r=>!['Selesai','Disetujui'].includes(r.status)).length,'activity')}${kpi('Menunggu Approval',rs.filter(r=>r.approval===1||r.approval===2).length,'clock')}${kpi('Tuntas',rs.filter(r=>r.approval===3).length,'check')}</div><h2 class="section-title">Layanan & Fungsi Utama</h2><div class="grid cols2">${u.menus.map(m=>`<button class="service-card" data-action="unit-page" data-menu="${m}"><span class="service-ic" style="color:${u.color};background:${u.soft}">${ic(MENUS[m].icon)}</span><span><strong>${MENUS[m].title}</strong><small>${MENUS[m].description}</small></span>${ic('arrow','sm')}</button>`).join('')}</div><div class="grid cols2" style="margin-top:20px"><section class="panel panel-pad"><div class="panel-h"><h3>Data Memerlukan Tindak Lanjut</h3></div>${rs.filter(r=>r.approval!==3).slice(0,5).map(r=>`<button class="portal-flow" data-action="record-detail" data-id="${e(r.id)}"><span class="mini-icon">${ic('file')}</span><span class="grow"><strong>${e(r.title)}</strong><small>${MENUS[r.menu].title}</small></span>${st(r.status)}</button>`).join('')||'<div class="empty">Tidak ada pekerjaan.</div>'}</section><section class="panel panel-pad"><div class="panel-h"><h3>Mandat Unit</h3></div>${u.functions.map((txt,i)=>`<div class="work-task"><span class="tag blue">0${i+1}</span><div><strong>${e(txt)}</strong></div></div>`).join('')}</section></div><div class="notice">${ic('info','sm')} Semua data di halaman ini adalah contoh. Hak akses unit diverifikasi pada setiap aksi di UI demo, namun hanya backend production yang dapat memberikan perlindungan nyata.</div>`}
function recordsPage(menu){const def=MENUS[menu];const rs=visibleRecords(def.unit).filter(r=>r.menu===menu);const q=ui.query.toLowerCase();const matches=rs.filter(r=>[r.title,r.number,r.subject,r.recipient,r.id].join(' ').toLowerCase().includes(q));return `${sectionHeading(def.title,def.description,`${canCreate(def.unit)?`<button class="btn primary" data-action="new-record" data-menu="${menu}">${ic('plus','sm')} Tambah Data</button>`:''}<button class="btn" data-action="csv" data-menu="${menu}">${ic('download','sm')} Export CSV</button>`)}<section class="panel"><div class="table-tools"><label class="search">${ic('search','sm')}<input id="table-search" placeholder="Cari nomor atau uraian..." value="${e(ui.query)}"></label><span class="tag blue">${matches.length} data tersedia</span></div><div class="scroll-table"><table class="data-table"><thead><tr><th>Register</th><th>Nama Dokumen / Pekerjaan</th>${def.cols.slice(0,3).map(c=>`<th>${e(c[1])}</th>`).join('')}<th>Status</th><th>Detail</th></tr></thead><tbody>${matches.map(r=>`<tr><td>${e(r.id)}</td><td><span class="table-title">${e(r.title)}</span><span class="table-sub">${e(def.title)} · ${fmt(r.updated,true)}</span></td>${def.cols.slice(0,3).map(c=>`<td>${e(String(r[c[0]]??'—'))}</td>`).join('')}<td>${st(r.status)}</td><td><button class="btn xs" data-action="record-detail" data-id="${e(r.id)}">Detail ${ic('chevron','sm')}</button></td></tr>`).join('')||`<tr><td colspan="7" class="table-empty">Tidak ada data yang cocok.</td></tr>`}</tbody></table></div></section>`}
function myInbox(){let work=myTasks(),review=db.records.filter(r=>canApprove(r));return `<main class="page-wrap">${sectionHeading('Kotak Tugas Saya','Seluruh disposisi, permintaan tindak lanjut, dan dokumen yang membutuhkan keputusan Anda.',`<button class="btn" data-action="go-portal">${ic('left','sm')} Portal</button>`)}<div class="grid cols3 inbox-counters">${kpi('Tugas Disposisi',work.length,'clipboard')}${kpi('Persetujuan Dokumen',review.length,'check')}${kpi('Notifikasi Belum Dibaca',unread(),'bell')}</div><section class="panel panel-pad" style="margin-top:20px"><div class="panel-h"><div><h3>Disposisi yang Menunggu Tindakan Anda</h3><small>Tindakan hanya dapat dilakukan oleh penerima yang sedang ditugaskan.</small></div></div>${work.map(w=>`<button class="inbox-line" data-action="open-flow" data-id="${e(w.id)}"><span class="queue-symbol">${ic('clipboard')}</span><span class="grow"><strong>${e(w.subject)}</strong><small>${e(w.id)} · ${e(labels[w.stage])} · ${e(labelUnit(w.unit))} · Tenggat ${fmt(w.due)}</small></span><span class="tag orange"><span class="blink"></span> Butuh Aksi</span>${ic('chevron','sm')}</button>`).join('')||'<div class="empty">Tidak ada disposisi yang membutuhkan tindakan Anda.</div>'}</section><section class="panel panel-pad" style="margin-top:20px"><div class="panel-h"><h3>Dokumen Menunggu Persetujuan</h3></div>${review.map(r=>`<button class="inbox-line" data-action="record-detail" data-id="${e(r.id)}"><span class="queue-symbol">${ic('file')}</span><span class="grow"><strong>${e(r.title)}</strong><small>${labelUnit(r.unit)} · ${MENUS[r.menu].title}</small></span><span class="tag orange">Review</span>${ic('chevron','sm')}</button>`).join('')||'<div class="empty">Tidak ada dokumen yang menunggu persetujuan Anda.</div>'}</section></main>`}
function flowsPage(){let flows=myFlows().filter(w=>ui.tab==='all'||(ui.tab==='mine'?w.assigned===user.id:w.stage===6));return `<main class="page-wrap">${sectionHeading('Monitoring Disposisi Berjenjang','Pantau perjalanan surat, penerima, waktu tindakan, dan progres penyelesaiannya.',`<button class="btn" data-action="go-portal">${ic('left','sm')} Portal</button>${user.id==='urmin'?`<button class="btn primary" data-action="new-flow">${ic('plus','sm')} Buat Disposisi</button>`:''}`)}<div class="flow-tabs"><button class="${ui.tab==='all'?'selected':''}" data-action="flow-tab" data-tab="all">Seluruh dalam Akses</button><button class="${ui.tab==='mine'?'selected':''}" data-action="flow-tab" data-tab="mine">Tugas Saya</button><button class="${ui.tab==='done'?'selected':''}" data-action="flow-tab" data-tab="done">Selesai</button></div><div class="flow-cards">${flows.map(w=>flowCard(w)).join('')||'<div class="panel empty">Belum ada disposisi pada filter ini.</div>'}</div><div class="notice">${ic('info','sm')} Timeline dan notifikasi dihasilkan dari tindakan akun demo. Ini contoh proses berjenjang yang masih harus diselaraskan dengan SOP dan pejabat berwenang di instansi.</div></main>`}
function flowCard(w){let step=w.stage,percent=step===6?100:Math.round((step/6)*100);return `<button class="flow-card panel" data-action="open-flow" data-id="${e(w.id)}"><div class="flow-card-top"><span class="flow-kicker">${e(w.id)} · ${e(labelUnit(w.unit))}</span>${w.stage===6?'<span class="tag teal">Selesai</span>':`<span class="tag orange"><span class="blink"></span> ${e(labels[step])}</span>`}</div><strong class="flow-card-title">${e(w.subject)}</strong><p>Dari Urmin → ${e(actor(w.assigned))}${step===6?' · Diarsipkan':''}</p><div class="mini-timeline">${[0,1,2,3,4,5,6].map((n,i)=>`<span class="mini-node ${n<step?'done':n===step?'current':''}"></span>${i<6?`<span class="mini-line ${i<step?'done':''}"></span>`:''}`).join('')}</div><div class="flow-card-foot"><small>Target ${fmt(w.due)} · ${e(w.priority)}</small><span>Lihat perjalanan ${ic('arrow','sm')}</span></div></button>`}
function workflowPage(){let w=db.workflows.find(x=>x.id===ui.id);if(!w||!canWorkflow(w))return denied();const secret=!canFlowDetail(w),canAct=canActWorkflow(w),s=w.stage;return `<main class="page-wrap workflow-page"><div class="crumb"><button class="mini-link" data-action="flows">Disposisi</button>${ic('chevron','sm')}<b>${e(w.id)}</b></div><div class="flow-detail-head"><div><div class="section-eyebrow">WORKFLOW / DISPOSISI · ${e(w.id)}</div><h1>${e(w.subject)}</h1><p>Unit tujuan: <strong>${e(labelUnit(w.unit))}</strong> · Target penyelesaian ${fmt(w.due)}</p></div><button class="btn" data-action="flows">${ic('left','sm')} Daftar Disposisi</button></div><div class="detail-status panel"><div class="detail-status-left"><span class="status-orb ${s===6?'finished':''}">${ic(s===6?'check':'activity','lg')}</span><div><small>STATUS SAAT INI</small><h2>${e(labels[s])}</h2><p>${s===6?'Proses selesai dan tercatat pada riwayat.':`Sedang berada pada ${e(actor(w.assigned))}.`}</p></div></div><div class="detail-status-right"><b>${s===6?'100':Math.round(s/6*100)}%</b><small>tahapan selesai</small><div class="progress"><span style="width:${s===6?100:s/6*100}%"></span></div></div></div><div class="flow-detail-columns"><section class="panel panel-pad timeline-panel"><div class="panel-h"><div><h3>${ic('activity','sm')} Alur Disposisi Berjenjang</h3><small>Perjalanan dari pengirim hingga penyelesaian akhir</small></div><span class="tag blue">${s+1}/7 Tahap</span></div><div class="workflow-timeline">${typeNames.map((title,index)=>renderStage(w,index)).join('')}</div></section><aside class="flow-right">${secret?`<section class="panel panel-pad"><h3>Metadata terbatas</h3><p class="desc">Informasi detail dokumen dibatasi oleh klasifikasi dan hak akses. Tidak ada isi surat yang ditampilkan.</p></section>`:`<section class="panel panel-pad"><div class="panel-h"><h3>Informasi Surat & Instruksi</h3></div><div class="detail-grid"><span>Referensi</span><b>${e(w.letter)}</b><span>Asal</span><b>${e(w.origin)}</b><span>Klasifikasi</span><b>${e(w.priority)}</b><span>Penerima Saat Ini</span><b>${e(actor(w.assigned))}</b><span>Tenggat</span><b>${fmt(w.due)}</b></div><div class="divider"></div><p class="footnote">INSTRUKSI / ARAHAN</p><p class="instruction-text">${e(w.instruction)}</p></section>`}${canAct&&!secret?actionPanel(w):`<section class="panel panel-pad"><div class="waiting-banner">${ic(s===6?'check':'lock')}<div><strong>${s===6?'Proses Telah Selesai':'Tindakan Sedang Menunggu Pejabat Terkait'}</strong><p>${s===6?'Seluruh tahapan disposisi telah tercatat.':'Aksi hanya tersedia pada akun penerima aktif: '+actor(w.assigned)+'. Gunakan Ganti Akun Demo untuk mencoba tahap berikutnya.'}</p></div></div></section>`}<section class="panel panel-pad"><div class="panel-h"><h3>Riwayat Aktivitas</h3><span class="tag gray">${w.history.length} aktivitas</span></div><div class="audit-feed">${w.history.slice().reverse().map(h=>`<div class="audit-entry"><span class="audit-tick"></span><div><strong>${e(h.description)}</strong><small>Dari ${e(actor(h.by))}${h.to?' → '+e(actor(h.to)):''} · ${fmt(h.at,true)}</small></div></div>`).join('')}</div></section></aside></div><p class="footnote" style="margin-top:20px">Pengguna dan riwayat pada halaman ini adalah data fiktif. Pengujian visual tidak menggantikan tanda tangan elektronik, validasi naskah dinas, atau kontrol audit pada server produksi.</p></main>`}
function stageActor(w,i){return i===0?'urmin':i===1?'kabag':i===2?kasubId(w.unit):i===3?staffId(w.unit):i===4?kasubId(w.unit):i===5?'kabag':'Sistem Arsip'}
function renderStage(w,i){const s=w.stage,state=i<s?'done':i===s?(s===6?'done':'active'):'waiting';let events=w.history.filter(h=>h.step===i);let date=events.length?events[events.length-1].at:null;let desc=events.length?events[events.length-1].description:null;return `<div class="flow-step ${state}"><div class="step-rail"><span class="step-circle">${i<s||s===6?ic('check','sm'):String(i+1).padStart(2,'0')}</span>${i<6?'<div class="step-track"></div>':''}</div><div class="step-body"><div class="step-top"><div><h4>${e(typeNames[i])}</h4><p>${i===6?'Pengarsipan hasil akhir':e(actor(stageActor(w,i)))}</p></div><span class="step-state ${state}">${state==='done'?'Selesai':state==='active'?'Sedang berjalan':'Belum dimulai'}</span></div>${desc?`<div class="step-event">${e(desc)}</div>`:''}<div class="step-footer">${date?`${ic('clock','sm')} ${fmt(date,true)}`:state==='active'?`${ic('activity','sm')} Menunggu tindakan ${e(actor(w.assigned))}`:'Menunggu tahapan sebelumnya'}</div>${i===3&&(state==='active'||state==='done')?`<div class="micro-progress"><div><span>Progres tindak lanjut</span><strong>${w.progress||0}%</strong></div><div class="progress"><span style="width:${w.progress||0}%"></span></div></div>`:''}</div></div>`}
function actionPanel(w){const s=w.stage;const actionNames={1:'Teruskan Disposisi',2:'Tetapkan Pelaksana',3:'Simpan Progres / Kirim Hasil',4:'Verifikasi Hasil',5:'Selesaikan Disposisi'};return `<section class="panel panel-pad action-panel"><div class="panel-h"><div><h3>${ic('clipboard','sm')} Tindakan Anda</h3><small>${e(actor(w.assigned))} · tahap ${s+1}</small></div><span class="tag orange"><span class="blink"></span> Perlu Aksi</span></div><div class="form-label">${e(actionNames[s]||'Tindakan')}</div><form id="flow-action"><input type="hidden" name="wid" value="${e(w.id)}">${s===1?`<label class="form-label">Tujuan Subbag *</label><select class="auth-field" name="targetUnit" required>${modules.map(k=>`<option value="${k}" ${k===w.unit?'selected':''}>${labelUnit(k)}</option>`).join('')}</select>`:''}${s===3?`<label class="form-label">Progres Pekerjaan</label><div class="range-row"><input type="range" name="progress" id="flow-progress" min="0" max="100" step="5" value="${w.progress||0}"><strong id="range-value">${w.progress||0}%</strong></div><p class="footnote">Progres 100% untuk mengirim hasil ke Kasubbag. Di bawah 100%, hanya tersimpan sebagai pembaruan progres.</p>`:''}<label class="form-label">Catatan tindakan *</label><textarea name="note" rows="4" class="auth-field" placeholder="Jelaskan keputusan, arahan, atau hasil pekerjaan..." minlength="5" maxlength="1000" required></textarea><div class="action-buttons">${s===4?`<button class="btn danger" name="operation" value="return">${ic('refresh','sm')} Kembalikan untuk Perbaikan</button>`:''}${s===5?`<button class="btn" name="operation" value="return">${ic('refresh','sm')} Kembalikan ke Kasubbag</button>`:''}<button class="btn primary" name="operation" value="next" type="submit">${ic('arrow','sm')} ${s===3?'Simpan Progres / Kirim Hasil':s===5?'Selesaikan':s===4?'Verifikasi & Lanjutkan':actionNames[s]}</button></div></form></section>`}
function noticePage(){let list=notices();return `<main class="page-wrap">${sectionHeading('Pusat Notifikasi','Informasi disposisi dan keputusan yang ditujukan kepada identitas Anda.',`<button class="btn" data-action="read-all">${ic('check','sm')} Tandai Semua Dibaca</button>`)}<section class="panel panel-pad">${list.map(n=>`<button class="inbox-line" data-action="open-notify" data-id="${e(n.id)}"><span class="queue-symbol ${n.read?'':'attention'}">${ic('bell')}</span><span class="grow"><strong>${e(n.title)} ${!n.read?'<span class="tag orange">Baru</span>':''}</strong><small>${e(n.body)} · ${fmt(n.at,true)}</small></span>${ic('chevron','sm')}</button>`).join('')||'<div class="empty">Belum ada notifikasi untuk akun ini.</div>'}</section></main>`}
function rbacPage(){if(user.id!=='admin'&&user.id!=='kabag')return denied();let units=modules,rows=users.map(u=>{let accessible=units.map(k=>u.id==='kabag'?'Ringkasan + detail biasa':u.unit===k?'Sesuai tugas':'—');return `<tr><td><strong>${e(u.name)}</strong><small class="table-sub">${e(u.role)}</small></td>${accessible.map((v,i)=>`<td>${v==='—'?'<span class="tag gray">Tidak</span>':`<span class="tag ${u.id==='kabag'?'blue':'teal'}">${e(v)}</span>`}${(db.grants||[]).some(g=>g.to===u.id&&g.unit===units[i])?'<span class="tag orange">Delegasi</span>':''}</td>`).join('')}</tr>`}).join('');return `<main class="page-wrap">${sectionHeading('Manajemen Kewenangan & RBAC','Role, unit penempatan, ringkasan akses, serta delegasi akses sementara dalam simulasi.',`<button class="btn" data-action="go-portal">${ic('left','sm')} Portal</button>`)}<div class="grid cols3 inbox-counters">${kpi('Identitas Demo',users.length,'users')}${kpi('Unit Organisasi',modules.length,'layers')}${kpi('Delegasi Aktif',db.grants.length,'shield')}</div><section class="panel panel-pad" style="margin-top:18px"><div class="panel-h"><div><h3>Matriks Akses Organisasi</h3><small>Hak default menurut jabatan dan unit, bukan akses bebas seluruh data</small></div></div><div class="scroll-table"><table class="data-table"><thead><tr><th>Pengguna / Role</th>${units.map(k=>`<th>${labelUnit(k)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div><div class="notice" style="margin-top:18px">${ic('info','sm')} Kabagrenmin dapat memantau ringkasan lintas unit dan dokumen biasa sesuai kewenangan. Administrator mengelola sistem, tetapi tidak otomatis mendapat akses isi dokumen. Data berklasifikasi dibatasi lebih lanjut.</div></section>${user.id==='admin'?`<section class="panel panel-pad" style="margin-top:18px"><div class="panel-h"><div><h3>Simulasi Delegasi Akses Unit</h3><small>Akses dapat diberikan hanya oleh akun Administrator demo.</small></div></div><form id="grant-form" class="grid cols3 grant-form"><div><label class="form-label">Pengguna</label><select class="auth-field" name="to" required>${users.filter(u=>!['kabag','admin'].includes(u.id)).map(u=>`<option value="${u.id}">${e(u.name)}</option>`).join('')}</select></div><div><label class="form-label">Unit yang Diizinkan</label><select class="auth-field" name="unit">${units.map(k=>`<option value="${k}">${labelUnit(k)}</option>`).join('')}</select></div><div><label class="form-label">Lingkup</label><select class="auth-field" name="level"><option value="summary">Monitoring ringkasan saja</option><option value="operate">Operasional unit</option></select></div><div class="grant-submit"><button class="btn primary" type="submit">${ic('plus','sm')} Tambahkan Delegasi</button></div></form><div class="divider"></div>${db.grants.length?db.grants.map(g=>`<div class="inbox-line"><span class="grow"><strong>${actor(g.to)} → ${labelUnit(g.unit)}</strong><small>${g.level==='summary'?'Monitoring ringkasan':'Operasional unit'} · diberikan oleh Administrator demo</small></span><button class="btn danger xs" data-action="revoke-grant" data-id="${e(g.id)}">Cabut</button></div>`).join(''):'<p class="footnote">Belum ada delegasi akses.</p>'}</section>`:''}<p class="footnote page-footer">Implementasi production wajib menyimpan permission dan audit log di backend, menggunakan server-side authorization di setiap endpoint serta persetujuan resmi untuk delegasi.</p></main>`}
function settingsPage(){if(user.id!=='admin')return denied();return `<main class="page-wrap">${sectionHeading('Konfigurasi Prototype','Logo portal, identitas aplikasi, dan reset data simulasi.',`<button class="btn" data-action="rbac">${ic('shield','sm')} RBAC</button>`)}<div class="grid cols2"><section class="panel panel-pad"><div class="panel-h"><h3>Identitas Portal</h3></div><form id="settings-form"><label class="form-label">Nama Instansi</label><input class="auth-field" name="name" value="${e(db.settings.name)}" maxlength="100" required><label class="form-label">Subjudul</label><input class="auth-field" name="subtitle" value="${e(db.settings.subtitle)}" maxlength="90"><label class="form-label">Upload Logo (JPG/PNG/WEBP max 600 KB)</label><input class="auth-field" type="file" id="logo-file" accept="image/png,image/jpeg,image/webp"><button class="btn primary" type="submit">${ic('check','sm')} Simpan</button></form></section><section class="panel panel-pad"><div class="panel-h"><h3>Data Demo</h3></div><p class="desc">Reset akan menghapus seluruh perubahan demo, disposisi, notifikasi, dan delegasi akses di browser ini.</p><div class="divider"></div><button class="btn danger" data-action="reset">${ic('refresh','sm')} Reset Data Demo</button></section></div></main>`}
function denied(){return `<main class="page-wrap"><section class="panel empty denied-page"><div class="denied-icon">${ic('lock','lg')}</div><h2>Akses Dibatasi</h2><p>Halaman atau dokumen ini tidak termasuk kewenangan akun <strong>${e(user?.name||'')}</strong>. Akses dari tautan langsung tetap diperiksa.</p><button class="btn primary" data-action="go-portal">${ic('left','sm')} Kembali ke Portal</button></section></main>`}
function modal(title,subtitle,body,footer=''){document.getElementById('modal-root').innerHTML=`<div class="scrim" data-action="close-modal"><div class="dialog" role="dialog" aria-modal="true" aria-label="${e(title)}"><div class="dialog-head"><div><h2>${e(title)}</h2><p>${e(subtitle)}</p></div><button class="btn icon" data-action="close-modal" aria-label="Tutup">${ic('x')}</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-foot">${footer}</div>`:''}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function newFlow(){if(user.id!=='urmin')return toast('Hanya Urmin yang dapat mendaftarkan disposisi demo.',true);const sources=db.records.filter(r=>r.menu==='surat-masuk');modal('Registrasi Disposisi Baru','Tahap pertama: Urmin mendaftarkan surat, lalu sistem meneruskan ke Kabagrenmin.',`<form id="new-flow-form" class="stack"><div class="field"><label>Referensi Surat Masuk</label><select class="auth-field" name="source">${sources.map(r=>`<option value="${e(r.id)}">${e(r.number||r.id)} — ${e(r.title)}</option>`).join('')}</select></div><div class="field"><label>Perihal / Uraian Disposisi</label><input class="auth-field" name="subject" required maxlength="130" placeholder="Tindak lanjut surat ..."></div><div class="field"><label>Unit Tujuan Usulan</label><select name="unit" class="auth-field">${modules.map(k=>`<option value="${k}">${labelUnit(k)}</option>`).join('')}</select></div><div class="field"><label>Tenggat</label><input name="due" type="date" class="auth-field" required value="${rel(7)}"></div><div class="field"><label>Instruksi Ringkas</label><textarea name="instruction" required minlength="5" maxlength="1200" class="auth-field" rows="3">Mohon ditindaklanjuti sesuai kewenangan dan dilaporkan hasilnya.</textarea></div><div class="notice">${ic('info','sm')} Setelah registrasi, disposisi masuk ke kotak tugas Kabagrenmin dan tercatat pada timeline.</div><button class="btn primary wide" type="submit">${ic('send','sm')} Registrasi & Kirim ke Kabagrenmin</button></form>`)}
function field(f,r){const [name,label,type,attr]=f,val=e(r?.[name]||'');let required=attr===true?'required':'';let html=Array.isArray(attr)?`<select class="auth-field" name="${e(name)}">${attr.map(x=>`<option ${x===r?.[name]?'selected':''}>${e(x)}</option>`).join('')}</select>`:type==='textarea'?`<textarea class="auth-field" name="${e(name)}" rows="2" ${required}>${val}</textarea>`:`<input class="auth-field" name="${e(name)}" type="${e(type)}" value="${val}" ${required}>`;return `<div class="field"><label>${e(label)}</label>${html}</div>`}
function newRecord(menu,id=null){const def=MENUS[menu];const rec=id?db.records.find(r=>r.id===id):null;if(!def||!canCreate(def.unit)||rec&&!canEdit(rec))return toast('Akses tidak diizinkan.',true);let body=`<form id="record-form" class="stack"><input type="hidden" name="rid" value="${e(id||'')}"><input type="hidden" name="menu" value="${e(menu)}"><div class="field"><label>Judul / Nama Pekerjaan *</label><input class="auth-field" name="title" value="${e(rec?.title||'')}" maxlength="130" required></div><div class="form-grid">${def.fields.map(f=>field(f,rec)).join('')}</div><div class="field"><label>Catatan</label><textarea class="auth-field" name="notes" rows="3">${e(rec?.notes||'')}</textarea></div><button class="btn primary wide" type="submit">${ic('check','sm')} Simpan ${e(def.title)}</button></form>`;modal(rec?'Edit Data':'Tambah '+def.title,'Data simulasi tersimpan lokal dan mengikuti kebijakan akses di prototype.',body)}
function recordDetail(id){let r=db.records.find(x=>x.id===id);if(!r||!canReadRecord(r))return toast('Anda tidak memiliki akses terhadap dokumen ini.',true);const canSubmit=r.approval===0&&canEdit(r),canReview=canApprove(r);const reviewItems=[{name:'Disusun / Draft',status:0},{name:'Review Kasubbag / Urmin',status:1},{name:'Review Kabagrenmin',status:2},{name:'Selesai / Disetujui',status:3}];const body=`<div class="record-meta">${[['Register',r.id],['Unit',labelUnit(r.unit)],['Modul',MENUS[r.menu].title],['Perihal',r.title],...MENUS[r.menu].fields.slice(0,5).map(f=>[f[1],r[f[0]]||'—'])].map(([k,v])=>`<div><span>${e(k)}</span><b>${e(v)}</b></div>`).join('')}</div><div class="divider"></div><div class="panel-h"><h3>Alur Persetujuan Dokumen</h3>${st(r.status)}</div><div class="approval-steps">${reviewItems.map((item,i)=>`<div class="approval-step ${r.approval>=i?'passed':''}"><span>${r.approval>=i?ic('check','sm'):i+1}</span><small>${e(item.name)}</small></div>`).join('')}</div><div class="record-history">${(r.approvalLog||[]).map(h=>`<div class="audit-entry"><span class="audit-tick"></span><div><strong>${e(h.event)}</strong><small>${actor(h.by)}${h.to?' → '+actor(h.to):''} · ${fmt(h.at,true)}</small></div></div>`).join('')}</div>${canSubmit||canReview?`<form id="approval-form"><input type="hidden" name="rid" value="${e(r.id)}"><label class="form-label">Catatan keputusan</label><textarea class="auth-field" name="note" placeholder="Tuliskan arahan/review singkat..." rows="2" maxlength="600"></textarea><div class="action-buttons">${canReview?`<button class="btn danger" type="submit" name="decision" value="return">Kembalikan / Revisi</button>`:''}<button class="btn primary" type="submit" name="decision" value="next">${canSubmit?'Ajukan Review':r.approval===2?'Setujui & Selesaikan':'Setujui & Teruskan'}</button></div></form>`:`<div class="notice">${ic('lock','sm')} Tidak ada tindakan yang menjadi kewenangan akun ini pada tahapan dokumen sekarang.</div>`}`;
modal(r.title,'Detail pekerjaan dan alur persetujuan berjenjang.',body,canEdit(r)?`<button class="btn" data-action="edit-record" data-id="${e(r.id)}">${ic('edit','sm')} Edit</button><button class="btn" data-action="close-modal">Tutup</button>`:'<button class="btn" data-action="close-modal">Tutup</button>')}
function runWorkflow(f,action){const w=db.workflows.find(x=>x.id===f.get('wid'));if(!w||!canActWorkflow(w))return toast('Tindakan ditolak: bukan penerima aktif.',true);let note=String(f.get('note')||'').trim();if(note.length<5)return toast('Catatan tindakan wajib diisi minimal 5 karakter.',true);let op=action||'next',before=w.stage,after=before,description='';if(op==='return'&&before===4){after=3;w.progress=75;description='Verifikasi meminta perbaikan: '+note}else if(op==='return'&&before===5){after=4;description='Kabag meminta pemeriksaan ulang: '+note}else if(op==='next'){
 if(before===1){let target=String(f.get('targetUnit'));if(!modules.includes(target))return toast('Unit tidak valid',true);w.unit=target;description='Arahan Kabag ke '+labelUnit(target)+': '+note;after=2}
 else if(before===2){description='Kasubbag menugaskan pelaksana: '+note;after=3}
 else if(before===3){let p=Number(f.get('progress'));if(!Number.isFinite(p)||p<0||p>100||p<w.progress)return toast('Progres tidak boleh turun.',true);w.progress=p;description=`Pelaksana memperbarui progres ${p}%: ${note}`;after=p===100?4:3}
 else if(before===4){description='Kasubbag memverifikasi hasil: '+note;after=5}
 else if(before===5){description='Kabagrenmin menyelesaikan disposisi: '+note;after=6}
 else return toast('Tahapan tidak bisa diproses.',true)
 }else return toast('Aksi tidak dikenal.',true);
 w.stage=after;w.updated=dt();w.assigned=after===6?'':after===1?'kabag':after===2?kasubId(w.unit):after===3?staffId(w.unit):after===4?kasubId(w.unit):'kabag';w.history.push({id:'H'+Date.now()+Math.random().toString(36).slice(2,5),step:before,by:user.id,to:w.assigned||'archive',description,at:dt()});if(after===6)w.history.push({id:'HS'+Date.now(),step:6,by:user.id,description:'Disposisi ditutup dan dicatat sebagai selesai',at:dt()});
 if(after!==before&&after<6)notify(w.assigned,w.id,'Disposisi baru menunggu tindakan',`${w.id} · ${w.subject}`);
 if(after===6)notify('urmin',w.id,'Disposisi telah selesai',`${w.id} · ${w.subject}`);
 log(user.id,'Workflow',`${w.id} ${before} → ${after}`);save();render();toast(after===before?'Pembaruan progres tersimpan.':after===6?'Disposisi berhasil diselesaikan.':'Disposisi diteruskan ke penerima berikutnya.')}
function submitApproval(f,decision){let r=db.records.find(x=>x.id===f.get('rid'));if(!r)return;let note=String(f.get('note')||'').trim();if(decision==='next'){if(!((r.approval===0&&canEdit(r))||canApprove(r)))return toast('Tidak berwenang melakukan approval.',true);r.approval+=1;r.status=r.approval===3?'Disetujui':'Menunggu Persetujuan';r.approvalLog.push({by:user.id,at:dt(),event:`Tahap ${r.approval} disetujui/diteruskan`+(note?' — '+note:'')});}else if(decision==='return'){if(!canApprove(r))return toast('Tidak berwenang melakukan revisi.',true);r.approval=0;r.status='Revisi';r.approvalLog.push({by:user.id,at:dt(),event:'Dikembalikan untuk revisi'+(note?' — '+note:'')});}else return;
 r.updated=dt();let to=r.approval===1?kasubId(r.unit):r.approval===2?'kabag':r.owner||'urmin';if(to&&to!==user.id)notify(to,r.id,decision==='return'?'Dokumen dikembalikan untuk revisi':r.approval===3?'Dokumen telah disetujui':'Dokumen menunggu review',r.title,'record');log(user.id,'Approval',r.id);save();render();recordDetail(r.id);toast('Keputusan persetujuan berhasil dicatat (demo).')}
function createDisposition(f){if(user.id!=='urmin')return;let source=db.records.find(r=>r.id===f.get('source')&&r.menu==='surat-masuk');if(!source)return toast('Surat masuk tidak ditemukan.',true);let unit=String(f.get('unit')),subject=String(f.get('subject')||'').trim(),ins=String(f.get('instruction')||'').trim(),due=String(f.get('due'));if(!modules.includes(unit)||subject.length<4||ins.length<5||!due)return toast('Lengkapi isian disposisi.',true);let id='DSP-'+String(100+db.workflows.length+1),w={id,letter:source.number||source.id,sourceId:source.id,subject,origin:source.sender||'Unit Pengirim',unit,stage:1,progress:0,due,priority:source.classification||'Biasa',instruction:ins,assigned:'kabag',created:dt(),updated:dt(),history:[{id:'H'+Date.now(),step:0,by:user.id,to:'kabag',description:'Surat diregistrasi dan diteruskan ke Kabagrenmin',at:dt()}]};db.workflows.unshift(w);notify('kabag',id,'Disposisi membutuhkan arahan',subject);log(user.id,'Registrasi disposisi',id);save();closeModal();go('flow',null,id);toast('Disposisi terdaftar dan notifikasi Kabag dibuat.')}
function submitRecord(f){let menu=String(f.get('menu')),id=String(f.get('rid')),def=MENUS[menu],record=db.records.find(r=>r.id===id);if(!def||!canCreate(def.unit)||record&&!canEdit(record))return toast('Akses dibatasi.',true);let title=String(f.get('title')||'').trim();if(!title)return toast('Judul wajib diisi',true);if(!record){record={id:'REG-'+String(Date.now()).slice(-7),unit:def.unit,menu,title,approval:0,approvalLog:[{by:user.id,at:dt(),event:'Dokumen dibuat'}],status:'Draft',created:dt(),owner:user.id};db.records.unshift(record)}record.title=title;for(let v of def.fields)record[v[0]]=String(f.get(v[0])||'').trim().slice(0,1000);record.notes=String(f.get('notes')||'').slice(0,1200);record.updated=dt();if(!record.classification)record.classification='Internal';save();closeModal();render();toast('Data tersimpan. Selanjutnya dapat diajukan untuk review.')}
function csv(menu){let def=MENUS[menu],rows=visibleRecords(def.unit).filter(r=>r.menu===menu);let data=[['Kode','Judul','Status','Unit'],...rows.map(r=>[r.id,r.title,r.status,labelUnit(r.unit)])].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bagrenmin-'+menu+'-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function profile(){modal('Profil & Akses Demo','Akun demo yang sedang aktif dan kewenangan yang diberikan.',`<div class="profile-card-big"><div class="avatar">${user.initial}</div><div><h3>${e(user.name)}</h3><p>${e(user.role)} ${user.unit?'· '+labelUnit(user.unit):''}</p></div></div><div class="divider"></div><h3>Lingkup Akses</h3><div class="stack">${modules.map(k=>`<div class="space"><span>${labelUnit(k)}</span>${canUnit(k)?'<span class="tag teal">Operasional</span>':canSummary(k)?'<span class="tag blue">Monitoring</span>':'<span class="tag gray">Tidak Diizinkan</span>'}</div>`).join('')}</div><div class="notice">${ic('lock','sm')} Akses ini adalah simulasi frontend. Gunakan sesi server-side dan permission resource-level pada production.</div>`,`<button class="btn" data-action="logout">${ic('left','sm')} Keluar / Ganti Akun Demo</button><button class="btn primary" data-action="close-modal">Tutup</button>`)}
function render(){if(!user){app.innerHTML=login();document.title='Login · BagRenmin Digital Workspace';return}let main=ui.view==='portal'?portal():ui.view==='unit'?unitWorkspace():ui.view==='inbox'?myInbox():ui.view==='flows'?flowsPage():ui.view==='flow'?workflowPage():ui.view==='notifications'?noticePage():ui.view==='rbac'?rbacPage():ui.view==='settings'?settingsPage():portal();app.innerHTML=header()+main;document.title=(ui.view==='flow'?ui.id+' · ':'')+'BagRenmin Digital Workspace | Demo'}
function executeAction(node){let a=node.dataset.action,id=node.dataset.id,unit=node.dataset.unit,menu=node.dataset.menu;
 if(a==='go-portal')return go('portal');if(a==='unit'){if(!canUnit(unit))return toast('Akses unit ini dibatasi.',true);return go('unit',unit,null,'overview')}
 if(a==='unit-page')return go('unit',ui.unit,null,menu);
 if(a==='flows')return go('flows');if(a==='open-flow')return go('flow',null,id);if(a==='my-inbox')return go('inbox');if(a==='notifications-page')return go('notifications');if(a==='rbac')return go('rbac');if(a==='settings')return go('settings');
 if(a==='toggle-side'){ui.side=!ui.side;render();return}if(a==='close-side'){ui.side=false;render();return}
 if(a==='toggle-notify'){ui.notify=!ui.notify;render();return}if(a==='open-notify'){let n=db.notifications.find(x=>x.id===id&&x.to===user.id);if(!n)return toast('Notifikasi tidak ditemukan.',true);n.read=true;save();if(n.recordId){ui.notify=false;render();return recordDetail(n.recordId)}return go('flow',null,n.workflowId)}
 if(a==='read-all'){notices().forEach(n=>n.read=true);save();render();toast('Semua notifikasi telah dibaca.');return}
 if(a==='flow-tab'){ui.tab=node.dataset.tab;render();return}if(a==='new-flow')return newFlow();if(a==='new-record')return newRecord(menu);if(a==='record-detail')return recordDetail(id);if(a==='edit-record'){closeModal();let r=db.records.find(x=>x.id===id);return r&&newRecord(r.menu,id)}
 if(a==='csv')return csv(menu);
 if(a==='profile')return profile();if(a==='close-modal'){closeModal();return}
 if(a==='back-login'){authStep='login';render();return}
 if(a==='logout'){try{sessionStorage.removeItem(AUTH)}catch{}user=null;otp='';authStep='login';closeModal();ui={view:'portal',unit:null,menu:null,id:null,tab:'all',query:'',side:false,notify:false};history.replaceState(null,'','#/portal');render();toast('Keluar dari sesi demo.');return}
 if(a==='revoke-grant'){if(user.id!=='admin')return toast('Hanya Administrator.',true);db.grants=db.grants.filter(x=>x.id!==id);save();render();toast('Delegasi dicabut.');return}
 if(a==='reset'){if(user.id!=='admin')return;if(!confirm('Reset seluruh data dan semua perubahan demo?'))return;db=seed();save();go('portal');toast('Data demo berhasil direset.');return}
}
document.addEventListener('click',ev=>{let node=ev.target.closest('[data-action]');if(!node)return;ev.preventDefault();let a=node.dataset.action;if(a==='close-modal'&&node.classList.contains('scrim')&&node!==ev.target)return;executeAction(node)});
document.addEventListener('input',ev=>{
 if(ev.target.id==='table-search'){
   let pos=ev.target.selectionStart;ui.query=ev.target.value;render();
   let next=document.getElementById('table-search');if(next){next.focus();next.setSelectionRange(pos,pos)}
 }
 if(ev.target.id==='flow-progress')document.getElementById('range-value').textContent=ev.target.value+'%';
});
document.addEventListener('submit',ev=>{let form=ev.target;const id=form.id;if(!['login-form','otp-form','flow-action','new-flow-form','record-form','approval-form','grant-form','settings-form'].includes(id))return;ev.preventDefault();const fd=new FormData(form);const clicked=ev.submitter?.value||'next';
 if(id==='login-form'){authChoice=document.getElementById('login-user').value;otp=String(Math.floor(100000+Math.random()*900000));authStep='otp';render();setTimeout(()=>document.getElementById('otp-input')?.focus(),0);return}
 if(id==='otp-form'){if(document.getElementById('otp-input').value!==otp)return toast('Kode demo tidak cocok.',true);user=byId(authChoice);try{sessionStorage.setItem(AUTH,user.id)}catch{}authStep='login';otp='';go('portal');toast('Simulasi verifikasi berhasil.');return}
 if(!user)return;
 if(id==='flow-action')return runWorkflow(fd,clicked);
 if(id==='new-flow-form')return createDisposition(fd);
 if(id==='record-form')return submitRecord(fd);
 if(id==='approval-form')return submitApproval(fd,clicked);
 if(id==='grant-form'){if(user.id!=='admin')return;let to=String(fd.get('to')),unit=String(fd.get('unit')),level=String(fd.get('level'));if(!byId(to)||!modules.includes(unit)||!['summary','operate'].includes(level))return toast('Delegasi tidak valid.',true);db.grants=db.grants.filter(g=>!(g.to===to&&g.unit===unit));db.grants.push({id:'G'+Date.now(),to,unit,level});log(user.id,'Delegasi',actor(to)+' -> '+labelUnit(unit));save();render();toast('Delegasi ditambahkan pada data demo.');return}
 if(id==='settings-form'){if(user.id!=='admin')return;db.settings.name=String(fd.get('name')).slice(0,100);db.settings.subtitle=String(fd.get('subtitle')).slice(0,90);save();render();toast('Pengaturan diperbarui.');return}
});
document.addEventListener('change',ev=>{if(ev.target.id!=='logo-file'||user?.id!=='admin')return;let f=ev.target.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>600000)return toast('Logo maksimal 600 KB, JPG/PNG/WEBP.',true);let reader=new FileReader();reader.onload=()=>{let src=String(reader.result);if(!validLogo(src))return toast('File tidak valid.',true);db.settings.logo=src;save();render();toast('Logo demo berhasil diubah.')};reader.readAsDataURL(f)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeModal();ui.notify=false;render()}});
window.addEventListener('hashchange',route);
window.addEventListener('storage',ev=>{if(ev.key===STORAGE){load();if(user)render()}});
load();let active=null;try{active=sessionStorage.getItem(AUTH)}catch{}user=byId(active)||null;route();
})();
</script></body></html>
