function displayValue(module,key,record){const v=record[key];if(key==='personId')return `<strong>${esc(personName(v))}</strong><div class="muted" style="font-size:10px">${esc(personById(v)?.nrp||'—')}</div>`;if(['date','startDate','endDate','submissionDate','effectiveDate','deadline','nextMaintenance'].includes(key))return `<span class="mono">${dateFmt(v)}</span>`;if(['status','condition'].includes(key))return chip(v);return esc(v||'—')}
function pageModule(module){const cfg=modules[module],items=db[module];const records=items.filter(r=>Object.values(r).join(' ').toLowerCase().includes(ui.search.toLowerCase())||personName(r.personId).toLowerCase().includes(ui.search.toLowerCase())).filter(r=>ui.filter==='all'||r.status===ui.filter);const statuses=[...new Set(items.map(x=>x.status).filter(Boolean))];return `${head(cfg.title,cfg.desc,`<button class="btn" data-action="export-csv" data-module="${module}">${icon('download',15)} Ekspor CSV</button><button class="btn btn-primary" data-action="add" data-module="${module}">${icon('plus',15)} Tambah Data</button>`)}<section class="panel"><div class="panel-head"><div><h3 class="panel-title">Register ${cfg.title}</h3><p class="panel-sub">${items.length} catatan administratif · tersimpan di browser</p></div>${icon(cfg.icon,18)}</div><div class="table-tools"><div class="field-search">${icon('search',15)}<input type="search" data-filter-search placeholder="Cari catatan atau nama personel..." value="${esc(ui.search)}"></div><select data-filter-status class="field-select"><option value="all">Semua Status</option>${statuses.map(s=>`<option ${ui.filter===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="table-wrap"><table class="data-table"><thead><tr>${cfg.cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>${records.map(r=>`<tr>${cfg.cols.map(c=>`<td>${displayValue(module,c[0],r)}</td>`).join('')}<td><div class="action-group"><button class="mini-action" data-action="edit" data-module="${module}" data-id="${esc(r.id)}" title="Edit">${icon('pencil',14)}</button><button class="mini-action" data-action="advance" data-module="${module}" data-id="${esc(r.id)}" title="Majukan status">${icon('check-check',14)}</button><button class="mini-action danger" data-action="delete" data-module="${module}" data-id="${esc(r.id)}" title="Hapus">${icon('trash-2',14)}</button></div></td></tr>`).join('')||`<tr><td colspan="${cfg.cols.length+1}"><div class="empty">${icon('inbox',24)}<strong>Belum ada data</strong><p>Tambah catatan atau ubah filter pencarian.</p></div></td></tr>`}</tbody></table></div><div class="table-foot"><span>Menampilkan ${records.length} dari ${items.length} catatan</span><span>${module==='letters'?'Metadata surat tanpa unggah dokumen':'Contoh pencatatan & workflow lokal'}</span></div></section>`}
function pageReports(){const act=db.personnel.filter(p=>p.status==='Aktif');const byUnit=units.map(unit=>({unit,n:act.filter(p=>p.unit===unit).length})),max=Math.max(1,...byUnit.map(x=>x.n));const statuses=Object.keys(modules).map(k=>({k,n:db[k].length,pending:db[k].filter(x=>['Diajukan','Diproses','Draft','Terjadwal','Pemeliharaan'].includes(x.status)).length}));return `${head('Laporan & Analitik','Ringkasan data administratif; ekspor CSV, cetak tampilan, dan cadangkan seluruh demo.',`<button class="btn" data-action="print">${icon('printer',15)} Cetak</button><button class="btn btn-primary" data-action="export-json">${icon('download',15)} Backup JSON</button>`)}<div class="stat-grid"><div class="stat-card"><div class="stat-top"><span class="stat-label">PERSONEL AKTIF</span>${icon('users',18)}</div><div class="value">${act.length}</div><div class="context">Per tanggal ${dateFmt(dateOnly())}</div></div><div class="stat-card"><div class="stat-top"><span class="stat-label">PENSIUN 30 HARI</span>${icon('alarm-clock',18)}</div><div class="value">${act.filter(p=>{const d=dayDiff(p.retirementDate);return d!==null&&d>=0&&d<=30}).length}</div><div class="context">Perlu persiapan administratif</div></div><div class="stat-card"><div class="stat-top"><span class="stat-label">LAYANAN SDM</span>${icon('clipboard-list',18)}</div><div class="value">${db.career.length+db.leaves.length+db.welfare.length}</div><div class="context">Karier, cuti dan kesejahteraan</div></div><div class="stat-card"><div class="stat-top"><span class="stat-label">ASET TERDAFTAR</span>${icon('package',18)}</div><div class="value">${db.assets.length}</div><div class="context">Inventaris demonstrasi</div></div></div><div class="report-grid"><section class="report-card"><h3>Komposisi Personel Aktif per Unit</h3><p>Distribusi administratif personel (data fiktif)</p>${byUnit.map(x=>`<div class="report-item"><span style="min-width:115px">${esc(x.unit)}</span><div class="bar-bg"><div class="bar-sm" style="width:${x.n/max*100}%"></div></div><strong>${x.n}</strong></div>`).join('')}</section><section class="report-card"><h3>Ringkasan Register per Modul</h3><p>Jumlah catatan dan yang membutuhkan tindak lanjut</p>${statuses.map(x=>`<div class="report-item"><span>${esc(modules[x.k].title)}</span><span><strong>${x.n}</strong><span class="muted"> entri</span>${x.pending?` · <span style="color:var(--gold)">${x.pending} proses</span>`:''}</span></div>`).join('')}</section></div><section class="panel"><div class="panel-head"><div><h3 class="panel-title">Unduh Laporan per Modul</h3><p class="panel-sub">CSV dibuka dengan Excel / aplikasi spreadsheet lain</p></div>${icon('file-spreadsheet',18)}</div><div class="panel-body"><div class="report-grid" style="margin:0">${[['personnel','Master Personel'],['retirements','Jadwal & Alert Pensiun'],...Object.keys(modules).map(k=>[k,modules[k].title])].map(([k,v])=>`<div class="report-item"><strong>${esc(v)}</strong><button class="btn btn-sm" data-action="export-csv" data-module="${k}">${icon('download',13)} CSV</button></div>`).join('')}</div></div></section>`}
function pageSettings(){return `${head('Pengaturan & Data Demo','Atur tema, backup, impor, dan reset dataset. Tidak ada sambungan server atau akun sungguhan.',`<button class="btn" data-action="export-json">${icon('hard-drive-download',15)} Backup JSON</button>`)}<div class="settings-layout"><section class="setting-block"><h3>Tampilan Antarmuka</h3><p>Preferensi tema dan sidebar disimpan terpisah di browser.</p><div class="radio-theme"><button class="btn ${!ui.dark?'active':''}" data-action="set-theme" data-theme="light">${icon('sun',15)} Light</button><button class="btn ${ui.dark?'active':''}" data-action="set-theme" data-theme="dark">${icon('moon',15)} Dark</button></div><div style="margin-top:15px"><button class="btn btn-soft" data-action="collapse-sidebar">${icon('panel-left',15)} ${ui.compact?'Perbesar Sidebar':'Perkecil Sidebar'}</button></div></section><section class="setting-block"><h3>Notifikasi Browser (Opsional)</h3><p>Aktifkan notifikasi sistem untuk alert saat halaman ini sedang dibuka. Tidak berjalan di background ketika tab/browser ditutup.</p><div class="setting-buttons"><button class="btn btn-soft" data-action="enable-browser-notification">${icon('bell-ring',15)} Izinkan Notifikasi</button></div><p style="margin-top:12px">Status: <strong id="permissionState">${typeof Notification==='undefined'?'Tidak didukung':esc(Notification.permission)}</strong></p></section><section class="setting-block"><h3>Backup / Restore</h3><p>Unduh atau impor data dalam format JSON. Impor akan menggantikan semua data demo saat ini.</p><div class="setting-buttons"><button class="btn" data-action="export-json">${icon('download',15)} Ekspor JSON</button><button class="btn" data-action="import-json">${icon('upload',15)} Impor JSON</button></div></section><section class="setting-block"><h3>Reset Simulasi</h3><p>Kembalikan personel fiktif dan seluruh modul ke kondisi contoh pertama. Operasi ini tidak dapat dibatalkan tanpa backup.</p><button class="btn btn-danger" data-action="re function render(){layout();navRender();let html='';if(ui.route==='portal')html=pagePortal();else if(ui.route==='dashboard')html=pageDashboard();else if(ui.route==='personnel')html=pagePersonnel();else if(ui.route==='retirements')html=pageRetirements();else if(ui.route==='reports')html=pageReports();else if(ui.route==='settings')html=pageSettings();else if(modules[ui.route])html=pageModule(ui.route);else html=pageDashboard();$('#content').innerHTML=html;$('#globalSearch').value=ui.search;renderPopover();reIcons()}
function renderPopover(){if(!ui.bellOpen){$('#popoverHost').innerHTML='';return}const as=alerts();$('#popoverHost').innerHTML=`<div class="notif-popover"><div class="pop-title"><strong>Notifikasi Pensiun</strong><span class="pill red">${unread().length} baru</span></div><div class="pop-items">${as.length?as.slice(0,6).map(a=>`<div class="pop-item" data-action="detail" data-id="${esc(a.p.id)}"><div class="round">${icon('alarm-clock',15)}</div><div><strong>${esc(a.p.name)} · ${esc(a.stage.key)}</strong><small>${a.days>0?a.days+' hari menuju pensiun':'Tanggal pensiun tercapai'} · ${dateFmt(a.p.retirementDate)} ${a.read?'· Ditinjau':''}</small></div></div>`).join(''):`<div class="empty">Tidak ada notifikasi aktif.</div>`}</div><button class="pop-foot" data-route="retirements">Buka pusat monitoring →</button></div>`;reIcons()}
function fieldHtml(name,label,type,required,opts=[],value='',full=false){let input='';const req=required?'required':'';const common=`name="${name}" id="f_${name}" ${req} class="form-control"`;
 if(type==='select'||type==='person'){const options=type==='person'?db.personnel.map(p=>[p.id,`${p.name} — ${p.nrp}`]):opts.map(o=>[o,o]);input=`<select ${common}><option value="">Pilih ${esc(label.toLowerCase())}</option>${options.map(([val,l])=>`<option value="${esc(val)}" ${String(val)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
 else if(type==='textarea')input=`<textarea ${common} placeholder="Catatan singkat (tanpa data sensitif)...">${esc(value)}</textarea>`;
 else input=`<input ${common} type="${type}" value="${esc(value)}" ${type==='text'?'maxlength="160"':''} ${type==='date'?'autocomplete="off"':''} />`;
 return `<div class="form-field ${full||type==='textarea'?'full':''}"><label for="f_${name}">${esc(label)} ${required?'<span class="required">*</span>':''}</label>${input}</div>`}
const personFields=[['name','Nama Lengkap','text',true],['nrp','NRP / NIP (demo)','text',true],['rank','Pangkat / Golongan','select',true,ranks],['employment','Jenis Personel','select',true,['Polri','PNS']],['unit','Unit Kerja','select',true,units],['position','Jabatan','text',true],['joinedDate','TMT Dinas','date',false],['retirementDate','Tanggal Pensiun','date',true],['status','Status Personel','select',true,['Aktif','MPP','Pensiun','Nonaktif']],['notes','Catatan Administrasi','textarea',false]];
function openForm(module,id=null,defaults={}){const isPerson=module==='personnel',cfg=modules[module];if(!isPerson&&!cfg)return;const target=id?db[module].find(r=>r.id===id):null;if(id&&!target){toast('Catatan tidak ditemukan','Mungkin sudah dihapus.',true);return}const record={...defaults,...(target||{})},fields=isPerson?personFields:cfg.fields;const singular=isPerson?'Personel':cfg.singular;const body=fields.map(f=>fieldHtml(f[0],f[1],f[2],f[3],f[4]||[],record[f[0]]||'',f[0]==='notes')).join('');$('#modalHost').innerHTML=`<div class="overlay" data-action="modal-backdrop"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Form ${esc(singular)}"><div class="modal-header"><div><h3>${id?'Edit':'Tambah'} ${esc(singular)}</h3><p>Isian bertanda * wajib diisi. Perubahan tersimpan langsung pada browser.</p></div><button class="icon-btn" data-action="close-modal" aria-label="Tutup">${icon('x',18)}</button></div><form id="recordForm" data-module="${module}" data-id="${esc(id||'')}"><div class="modal-body"><div class="form-grid">${body}</div>${isPerson?'<p class="form-hint" style="margin-top:17px">Tanggal pensiun digunakan untuk alert otomatis. Validasi usia dan aturan pensiun resmi perlu ditambahkan di versi production.</p>':''}</div><div class="modal-footer"><button type="button" class="btn" data-action="close-modal">Batal</button><button type="submit" class="btn btn-primary">${icon('save',15)} ${id?'Simpan Perubahan':'Simpan Data'}</button></div></form></div></div>`;reIcons();setTimeout(()=>$('#recordForm input, #recordForm select')?.focus(),30)}
function openDetail(id){const p=personById(id);if(!p){toast('Personel tidak ditemukan','Data mungkin sudah dihapus.',true);return}const d=dayDiff(p.retirementDate),s=p.status==='Aktif'?retirementStage(d):null;const related=Object.keys(modules).filter(k=>modules[k].fields.some(f=>f[0]==='personId')).map(k=>[modules[k].title,db[k].filter(r=>r.personId===id).length]);$('#modalHost').innerHTML=`<div class="overlay" data-action="modal-backdrop"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Detail personel"><div class="modal-header"><div><h3>Detail Personel</h3><p>Ringkasan profil dan administrasi kepegawaian</p></div><button class="icon-btn" data-action="close-modal">${icon('x',18)}</button></div><div class="modal-body"><div class="detail-banner"><div class="person-face">${esc(initials(p.name))}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.nrp)} · ${esc(p.unit)} · ${esc(p.rank)}</small></div><span style="margin-left:auto">${chip(p.status)}</span></div><div class="detail-grid">${[['Jabatan',p.position],['Jenis Personel',p.employment],['TMT Dinas',dateFmt(p.joinedDate)],['Tanggal Pensiun',dateFmt(p.retirementDate)]].map(([l,v])=>`<div class="detail-cell"><small>${l}</small><strong>${esc(v)}</strong></div>`).join('')}</div><div class="notice ${s?'warn':''}" style="margin-top:6px">${icon('alarm-clock',18)}<span>${s?`<strong>${esc(s.key)}:</strong> ${d>0?d+' hari menuju pensiun':'Tanggal pensiun tercapai'}. Pastikan administrasi disiapkan.`:`${p.status==='Aktif'&&d!==null?'Masa pensiun masih '+d+' hari lagi.':'Tidak ada alert pensiun aktif.'}`}</span></div><div class="detail-section">Rekam Administrasi Terkait</div><div class="detail-grid">${related.map(([k,n])=>`<div class="detail-cell"><small>${esc(k)}</small><strong>${n} catatan</strong></div>`).join('')}</div></div><div class="modal-footer"><button class="btn" data-action="close-modal">Tutup</button><button class="btn" data-action="create-retirement" data-id="${esc(id)}">${icon('file-plus',15)} Proses Pensiun</button><button class="btn btn-primary" data-action="edit" data-module="personnel" data-id="${esc(id)}">${icon('pencil',15)} Edit Profil</button></div></div></div>`;reIcons()}
function closeModal(){$('#modalHost').innerHTML=''}
function saveForm(form){const module=form.dataset.module,id=form.dataset.id;const raw=Object.fromEntries(new FormData(form).entries());const cfg=module==='personnel'?personFields:modules[module]?.fields;if(!cfg)return;const item={};for(const f of cfg)item[f[0]]=String(raw[f[0]]||'').trim();if(module==='personnel'){
 const dup=db.personnel.find(p=>p.nrp.toLowerCase()===item.nrp.toLowerCase()&&p.id!==id);if(dup){toast('NRP / NIP sudah digunakan','Gunakan nomor unik agar data tidak tertukar.',true);return}
 if(item.joinedDate&&item.retirementDate&&item.joinedDate>item.retirementDate){toast('Periksa tanggal','Tanggal pensiun harus sesudah TMT dinas.',true);return}
 }if(module==='leaves'&&item.startDate&&item.endDate&&item.endDate<item.startDate){toast('Tanggal cuti tidak valid','Tanggal selesai tidak boleh sebelum tanggal mulai.',true);return}
 if(module==='training'&&item.startDate&&item.endDate&&item.endDate<item.startDate){toast('Tanggal pelatihan tidak valid','Tanggal selesai tidak boleh sebelum tanggal mulai.',true);return}
 if(module==='assets'&&db.assets.some(x=>x.code.toLowerCase()===item.code.toLowerCase()&&x.id!==id)){toast('Kode aset sudah ada','Gunakan kode inventaris yang unik.',true);return}
 const arr=db[module];if(id){const idx=arr.findIndex(x=>x.id===id);if(idx<0)return;arr[idx]={...arr[idx],...item};log(`Memperbarui ${module==='personnel'?item.name:modules[module].singular}`,module)}else{arr.unshift({id:uid(),...item});log(`Menambahkan ${module==='personnel'?item.name:modules[module].singular}`,module)}save();closeModal();render();toast('Data berhasil disimpan','Perubahan telah tersimpan pada browser ini.')}
function advance(module,id){const r=db[module]?.find(x=>x.id===id);if(!r)return;const flow=['Draft','Diajukan','Terjadwal','Diproses','Berjalan','Disetujui','Selesai'],current=r.status;if(['Ditolak','Selesai','Dibatalkan','Diarsipkan','Dihapus'].includes(current)){toast('Tidak ada tahap berikutnya','Ubah status melalui tombol Edit.');return}let next;if(current==='Aktif')next='Pemeliharaan';else if(current==='Pemeliharaan')next='Aktif';else if(current==='Terjadwal')next='Berjalan';else if(current==='Berjalan')next='Selesai';else if(current==='Draft')next='Diproses';else if(current==='Diajukan')next='Diproses';else if(current==='Diproses')next='Disetujui';else if(current==='Disetujui')next='Selesai';else next=flow[flow.indexOf(current)+1]||'Selesai';r.status=next;log(`Mengubah status ${modules[module].singular} menjadi ${next}`,module);save();render();toast('Status diperbarui',`Tahap baru: ${next}`)}
function delRecord(module,id){const item=db[module]?.find(x=>x.id===id);if(!item)return;if(module==='personnel'&&Object.keys(modules).some(k=>db[k].some(r=>r.personId===id))){toast('Personel masih memiliki data terkait','Hapus catatan terkait dulu, atau ubah status personel.',true);return}if(!confirm('Hapus catatan ini dari browser demo? Tindakan tidak dapat dibatalkan tanpa backup.'))return;db[module]=db[module].filter(x=>x.id!==id);log(`Menghapus data dari ${module==='personnel'?'Personel':modules[module].title}`,module);save();render();toast('Catatan dihapus')}
function reviewAlert(key){db.acknowledgements[key]=new Date().toISOString();log('Meninjau alert pensiun','Pensiun');save();render();toast('Alert telah ditinjau','Alert tetap terlihat hingga masa tahap berubah.')}
function reviewAll(){const list=alerts().filter(a=>!a.read);if(!list.length){toast('Semua alert sudah ditinjau');return}for(const a of list)db.acknowledgements[a.key]=new Date().toISOString();log(`Meninjau ${list.length} alert pensiun`,'Pensiun');save();render();toast(`${list.length} alert ditandai ditinjau`)}
function createRetirement(id){const p=personById(id);if(!p)return;const exists=db.welfare.some(x=>x.personId===id&&x.service==='Persiapan Pensiun'&&!['Selesai','Ditolak'].includes(x.status));if(exists){closeModal();ui.route='welfare';ui.search=p.name;render();toast('Proses pensiun sudah tersedia','Buka modul Kesejahteraan untuk melihat catatan.');return}closeModal();openForm('welfare',null,{personId:id,service:'Persiapan Pensiun',deadline:p.retirementDate,status:'Diajukan',notes:`Persiapan administrasi pensiun ${p.name}. (Simulasi)`})}
function download(name,text,mime='text/plain;charset=utf-8'){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function safeCsv(v){const s=String(v??'');const guarded=/^[=+\-@\t\r]/.test(s)?`'${s}`:s;return `"${guarded.replace(/"/g,'""')}"`}
function exportCsv(module){let rows=[],file=module;if(module==='retirements'){rows=[['Nama','NRP/NIP','Unit','Pangkat','Tanggal Pensiun','Sisa Hari','Tahap','Sudah Ditinjau'],...alerts().map(a=>[a.p.name,a.p.nrp,a.p.unit,a.p.rank,a.p.retirementDate,a.days,a.stage.key,a.read?'Ya':'Belum'])]}else if(module==='personnel'){rows=[['Nama','NRP/NIP','Pangkat','Unit','Jabatan','Jenis Personel','TMT Dinas','Tanggal Pensiun','Status'],...db.personnel.map(p=>[p.name,p.nrp,p.rank,p.unit,p.position,p.employment,p.joinedDate,p.retirementDate,p.status])]}else if(modules[module]){const fs=modules[module].fields.filter(f=>f[0]!=='notes');rows=[fs.map(f=>f[1]),...db[module].map(r=>fs.map(f=>f[0]==='personId'?personName(r.personId):r[f[0]]))]}else return;download(`SUMDAONE-${file}-${dateOnly()}.csv`,'\uFEFF'+rows.map(row=>row.map(safeCsv).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV berhasil disiapkan',`${rows.length-1} catatan`)}
function exportJson(){download(`SUMDAONE-backup-${dateOnly()}.json`,JSON.stringify({schema:'sumda-one-demo-v1',exportedAt:new Date().toISOString(),data:db},null,2),'application/json;charset=utf-8');toast('Backup JSON disiapkan','Simpan berkas ini untuk restore data demo.')}
function reset(){if(!confirm('Reset semua data ke dataset simulasi awal? Seluruh perubahan lokal akan hilang.'))return;db=seed();save();ui.route='dashboard';ui.search='';ui.filter='all';ui.unit='all';render();toast('Data simulasi dipulihkan')}
function routeTo(route){if(!['portal','dashboard','personnel','retirements','reports','settings',...Object.keys(modules)].includes(route))return;ui.route=route;ui.search='';ui.filter='all';ui.unit='all';ui.alertFilter='all';ui.sideOpen=false;ui.bellOpen=false;render();window.scrollTo({top:0,behavior:'auto'})}
function browserNotify(){if(typeof Notification==='undefined'){toast('Browser tidak mendukung notifikasi sistem','Alert dalam aplikasi tetap tersedia.',true);return}if(!window.isSecureContext){toast('Notifikasi sistem perlu HTTPS atau localhost','Untuk file HTML lokal gunakan alert yang ada dalam aplikasi.',true);return}Notification.requestPermission().then(permission=>{const p=$('#permissionState');if(p)p.textContent=permission;if(permission==='granted'){toast('Notifikasi diizinkan','Notifikasi berjalan ketika halaman demo dibuka.');deliverNotifications()}else toast('Izin notifikasi tidak diberikan','Alert tetap muncul di dalam aplikasi.',true)}).catch(()=>toast('Gagal meminta izin notifikasi','Gunakan notifikasi di dalam aplikasi.',true))}
function deliverNotifications(){if(typeof Notification==='undefined'||Notification.permission!=='granted')return;db.delivered=db.delivered||{};const un=unread().filter(a=>!db.delivered[a.key]);if(!un.length)return;try{const sample=un[0];new Notification('SUBBAGSUMDA — Pengingat Pensiun',{body:un.length===1?`${sample.p.name}: ${sample.days} hari menuju pensiun (${sample.stage.key}).`:`Terdapat ${un.length} alert masa pensiun yang perlu ditinjau.`,tag:'sumda-pension-alert'});for(const x of un)db.delivered[x.key]=new Date().toISOString();save()}catch(e){console.warn('Notification unavailable',e)}}
// Handle actions through event delegation, including dynamic tables and dialogs.
document.addEventListener('click',event=>{const target=event.target.closest('[data-action],[data-route]');if(!target){if(ui.bellOpen&&!event.target.closest('.notif-popover')){ui.bellOpen=false;renderPopover()}return}
 if(target.dataset.route){routeTo(target.dataset.route);return}
 const action=target.dataset.action,mod=target.dataset.module,id=target.dataset.id;
 if(action==='portal-unit'){toast('Workspace BagRenmin', 'Demo ini memfokuskan SUBBAGSUMDA. Modul lain merupakan navigasi contoh.');return}
 if(action==='toggle-sidebar'){ui.sideOpen=!ui.sideOpen;layout();return}
 if(action==='close-sidebar'){ui.sideOpen=false;layout();return}
 if(action==='collapse-sidebar'){ui.compact=!ui.compact;saveUI();render();return}
 if(action==='toggle-theme'){ui.dark=!ui.dark;saveUI();render();return}
 if(action==='set-theme'){ui.dark=target.dataset.theme==='dark';saveUI();render();return}
 if(action==='toggle-notifications'){ui.bellOpen=!ui.bellOpen;renderPopover();return}
 if(action==='close-modal'){closeModal();return}
 if(action==='modal-backdrop'&&event.target===target){closeModal();return}
 if(action==='add'){openForm(mod);return}
 if(action==='edit'){openForm(mod,id);return}
 if(action==='detail'){ui.bellOpen=false;renderPopover();openDetail(id);return}
 if(action==='delete'){delRecord(mod,id);return}
 if(action==='advance'){advance(mod,id);return}
 if(action==='review-alert'){reviewAlert(target.dataset.key);return}
 if(action==='review-all'){reviewAll();return}
 if(action==='alert-filter'){ui.alertFilter=target.dataset.filter;render();return}
 if(action==='create-retirement'){createRetirement(id);return}
 if(action==='export-csv'){exportCsv(mod);return}
 if(action==='export-json'){exportJson();return}
 if(action==='import-json'){$('#importFile').click();return}
 if(action==='reset'){reset();return}
 if(action==='print'){window.print();return}
 if(action==='enable-browser-notification'){browserNotify();return}
});
document.addEventListener('submit',event=>{if(event.target.id==='recordForm'){event.preventDefault();saveForm(event.target)}});
document.addEventListener('input',event=>{if(!event.target.matches('[data-filter-search],#globalSearch'))return;const input=event.target;const start=input.selectionStart,end=input.selectionEnd,kind=input.id==='globalSearch'?'global':'table';ui.search=input.value;render();const same=kind==='global'?$('#globalSearch'):$('[data-filter-search]');if(same){same.focus();try{same.setSelectionRange(start,end)}catch{}}});
document.addEventListener('change',event=>{if(event.target.matches('[data-filter-status]')){ui.filter=event.target.value;render()}if(event.target.matches('[data-filter-unit]')){ui.unit=event.target.value;render()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if($('#modalHost').innerHTML)closeModal();else if(ui.bellOpen){ui.bellOpen=false;renderPopover()}else if(ui.sideOpen){ui.sideOpen=false;layout()}}});
$('#importFile').addEventListener('change',async event=>{const file=event.target.files?.[0];event.target.value='';if(!file)return;if(file.size>3*1024*1024){toast('Berkas terlalu besar','Maksimum 3 MB untuk demo.',true);return}try{const src=JSON.parse(await file.text());const data=src?.data??src;if(!validateDB(data)||data.personnel.some(p=>!p.id||!p.name||!p.nrp)){throw new Error('Skema data tidak cocok')}if(!confirm('Impor akan menggantikan seluruh data demo di browser ini. Lanjutkan?'))return;db={...seed(),...data,activity:Array.isArray(data.activity)?data.activity:[],acknowledgements:data.acknowledgements||{},delivered:data.delivered||{}};log('Memulihkan data dari berkas JSON','Sistem');save();render();toast('Data JSON berhasil diimpor')}catch(e){toast('Gagal impor data',e.message||'Format JSON tidak dapat digunakan.',true)}});
render();
if(document.readyState==='complete')reIcons();else window.addEventListener('load',reIcons);
// Update in-app alert counters after the local date changes while page remains open.
let lastDate=dateOnly();setInterval(()=>{const now=dateOnly();if(now!==lastDate){lastDate=now;render();deliverNotifications()}},60*1000);
if(typeof Notification!=='undefined'&&Notification.permission==='granted')deliverNotifications();
})();
</script>
</body>
</html>
