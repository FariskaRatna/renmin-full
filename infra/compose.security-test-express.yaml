# Stack uji keamanan EPHEMERAL untuk backend Express. Padanan
# compose.security-test.yaml yang menguji backend Go.
#
# Tidak pernah menyentuh volume SDL mana pun: database-nya hidup di tmpfs dan
# hilang bersama container. Jaringannya `internal: true`, jadi tidak ada port
# yang terbuka ke host maupun ke luar.
#
# Dijalankan lewat scripts/security-test-express.sh, yang membuat password acak
# per-run dan membersihkan stack-nya sendiri.
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: sdl_security_test
      POSTGRES_USER: sdl_security
      POSTGRES_PASSWORD: ${SDL_SECURITY_DB_PASSWORD:?generated password required}
    tmpfs:
      - /var/lib/postgresql:rw,nosuid,nodev,size=256m
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [security_isolated]

  test:
    build:
      context: ../apps/backend-express
      dockerfile: Dockerfile.security-test
    environment:
      SDL_SECURITY_TEST_CONFIRM: R2D5_EPHEMERAL_ONLY
      SDL_SECURITY_TEST_DATABASE_URL: postgres://sdl_security:${SDL_SECURITY_DB_PASSWORD}@db:5432/sdl_security_test?sslmode=disable
      # Runner migrasi membaca 33 SQL yang SAMA dengan Go, dari mount di bawah.
      SDL_MIGRATIONS_DIR: /migrations
      # Tanpa SMTP. Itu disengaja: kasus 06 membuktikan login ber-OTP gagal
      # TERTUTUP (503) alih-alih jatuh ke login password saja.
      NODE_ENV: production
    volumes:
      # Read-only, dan sengaja berupa mount alih-alih COPY: skema punya satu
      # sumber kebenaran, dipakai bersama kedua backend.
      - ../apps/backend/internal/migrations/sql:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [security_isolated]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  security_isolated:
    internal: true
