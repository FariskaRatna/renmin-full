# Overlay backend Express. Dipakai BERSAMA compose.dev.yaml:
#
#   docker compose --env-file .env \
#     -f infra/compose.dev.yaml -f infra/compose.express.yaml \
#     up -d --build api-express
#
# Berjalan BERDAMPINGAN dengan service `api` milik Go, berbagi database yang
# sama. Itu inti strategi strangler: selama migrasi keduanya hidup, dan Go tetap
# jadi oracle pembanding.
#
# Caddy/Vite belum diarahkan ke sini. Peralihan trafik dilakukan per prefix
# nanti, setelah tiap domain lolos perbandingan golden file.
name: sdl-foundation-r1
services:
  api-express:
    build:
      context: ../apps/backend-express
      dockerfile: Dockerfile
      # Skema punya SATU sumber dan dipakai bersama kedua backend (aturan 6).
      # Context tambahan membuatnya masuk ke image tanpa menyalinnya ke working
      # tree — padanan //go:embed milik Go. Tanpa ini `--migrate` tidak berguna
      # di dalam container.
      additional_contexts:
        migrations: ../apps/backend/internal/migrations/sql
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${SDL_DB_USER}:${SDL_DB_PASSWORD}@db:5432/${SDL_DB_NAME}?sslmode=disable"
      SDL_ENV: "development"
      SDL_DEV_SUPERADMIN_WORKSPACE: ${SDL_DEV_SUPERADMIN_WORKSPACE:-false}
      SDL_AUTH_SECRET: ${SDL_AUTH_SECRET:?Define SDL_AUTH_SECRET}
      SDL_EVIDENCE_KEY: ${SDL_EVIDENCE_KEY:?Define SDL_EVIDENCE_KEY}
      SDL_COOKIE_SECURE: ${SDL_COOKIE_SECURE:-false}
      SDL_ALLOWED_ORIGINS: ${SDL_ALLOWED_ORIGINS:-}
      SDL_SMTP_HOST: ${SDL_SMTP_HOST:-}
      SDL_SMTP_PORT: ${SDL_SMTP_PORT:-587}
      SDL_SMTP_USER: ${SDL_SMTP_USER:-}
      SDL_SMTP_PASSWORD: ${SDL_SMTP_PASSWORD:-}
      SDL_SMTP_FROM: ${SDL_SMTP_FROM:-}
      # ATURAN 7: hanya SATU worker email boleh aktif. Go menyalakan miliknya
      # secara default (SDL_EMAIL_NOTIFICATIONS_ENABLED bukan "false"), jadi
      # yang ini WAJIB tetap mati sampai peralihan. Urutan cutover-nya:
      # matikan di Go lebih dulu, baru nyalakan di sini — tidak ada urutan lain
      # yang tidak membuat keduanya menguras outbox yang sama.
      SDL_EMAIL_WORKER_ENABLED: ${SDL_EMAIL_WORKER_ENABLED:-false}
      SDL_EMAIL_NOTIFICATIONS_ENABLED: ${SDL_EMAIL_NOTIFICATIONS_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/server.js", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    # Node menulis ke /tmp untuk cache internal; sharp juga butuh ruang kerja.
    # Diberikan eksplisit, bukan dengan mematikan read_only.
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
