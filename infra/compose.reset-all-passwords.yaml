# Additive one-shot CLI only. Reuses isolated SDL development DB, no published ports.
services:
  reset-all-passwords:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.reset-all-passwords
    environment:
      DATABASE_URL: "postgres://${SDL_DB_USER}:${SDL_DB_PASSWORD}@db:5432/${SDL_DB_NAME}?sslmode=disable"
      SDL_ENV: development
    stdin_open: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
